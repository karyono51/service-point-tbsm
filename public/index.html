<!DOCTYPE html>

<style>
:root{--pri:#0e6b4e;--pt:#fff;--gold:#c8a24b;--bg:#f2f5f2;--card:#fff;--tx:#12201a;--mut:#5f6f68;--bd:#dfe7e2;--gr:#ecf1ed;--red:#d71920;--amb:#d98b00;--sh:0 1px 2px rgba(8,40,28,.05),0 10px 28px rgba(8,40,28,.07);color-scheme:light;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pri:#34c490;--pt:#05160f;--bg:#0b100e;--card:#141b17;--tx:#e9f1ed;--mut:#92a49b;--bd:#232d28;--gr:#1b2520;--sh:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--pri:#34c490;--pt:#05160f;--bg:#0b100e;--card:#141b17;--tx:#e9f1ed;--mut:#92a49b;--bd:#232d28;--gr:#1b2520;--sh:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh;min-height:100dvh}
.sb{width:280px;flex:none;position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;background:linear-gradient(175deg,#0a3a2a 0%,#0c5a41 100%);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));z-index:30;overflow-y:auto}
.brand{display:flex;gap:12px;align-items:flex-start;padding:4px 6px 18px;border-bottom:1px solid rgba(255,255,255,.14);margin-bottom:14px}
.brand img{width:50px;height:50px;border-radius:14px;background:#fff;padding:3px;flex:none}
.brand b{display:block;font-size:15.5px;line-height:1.2}
.brand span{display:block;font-size:12.5px;color:var(--gold);font-weight:600;margin-top:2px}
.brand small{display:block;font-size:10.5px;line-height:1.35;color:rgba(255,255,255,.68);margin-top:5px}
#menu{flex:1}
.sec{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;color:rgba(255,255,255,.5);margin:6px 10px 8px}
.mi{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:rgba(255,255,255,.86);font:inherit;font-size:14.5px;padding:11px 12px;border-radius:12px;cursor:pointer;text-align:left;position:relative;margin-bottom:2px}
.mi:hover{background:rgba(255,255,255,.08)}
.mi.on{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
.mi.on:before{content:'';position:absolute;left:-14px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--gold)}
.ic{width:20px;height:20px;flex:none}
.acct{border-top:1px solid rgba(255,255,255,.14);padding-top:12px}
.who{display:flex;align-items:center;gap:10px;padding:4px 6px 10px}
.av{width:38px;height:38px;border-radius:50%;background:var(--gold);color:#2a2005;display:grid;place-items:center;font-weight:700;flex:none}
.who b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}.who span{font-size:11.5px;color:rgba(255,255,255,.72)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.top h1{flex:1;margin:0;font-size:18px;font-weight:700}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);display:grid;place-items:center;cursor:pointer}
#burger{display:none}
#app{flex:1;width:100%;max-width:1040px;margin:0 auto;padding:18px 16px calc(84px + env(safe-area-inset-bottom,0px))}
.ft{position:fixed;left:0;right:0;bottom:0;z-index:15;text-align:center;font-size:11px;line-height:1.5;color:var(--mut);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--bd);background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);pointer-events:none}
@media(min-width:901px){.ft{left:280px}}
.ft span{display:inline-block}
@media(max-width:600px){.ft .fts{display:none}.ft span:last-child{display:block}}
.sbf{margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.14);text-align:center;font-size:10.5px;line-height:1.6;color:rgba(255,255,255,.6)}
.sbf span{display:block}
.scrim{display:none}
@media(max-width:900px){.sb{position:fixed;left:0;top:0;bottom:0;transform:translateX(-102%);transition:transform .25s ease;box-shadow:12px 0 40px rgba(0,0,0,.35)}.sb.open{transform:none}.scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25}#burger{display:grid}#app{padding:14px 12px calc(84px + env(safe-area-inset-bottom,0px))}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:12px}.grid .card{margin:0}
.stat{border-top:3px solid var(--gold)}.stat b{font-size:26px;display:block;line-height:1.25}.stat span{color:var(--mut);font-size:13px}
h2{font-size:18px;margin:16px 0 10px}h3{margin:0 0 10px;font-size:14px;font-weight:700;color:var(--pri)}
label{display:block;font-size:12.5px;color:var(--mut);margin:8px 0 3px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--pri) 40%,transparent);border-color:var(--pri)}
.f{display:grid;gap:0 10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.jr{display:grid;grid-template-columns:auto 1fr 120px;gap:8px;align-items:center;margin-bottom:6px}.jr.p{grid-template-columns:1fr 120px}
.ck{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:14px;color:var(--tx)}.ck input{width:auto}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0 14px}
.btn{background:var(--pri);color:var(--pt);border:0;padding:11px 20px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer}.btn.w{width:100%}
.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:7px 12px;font-weight:500;font-size:13px;border-radius:10px}.btn.dg{color:var(--red)}
.tot{position:sticky;bottom:calc(var(--ftH,56px) + 8px);z-index:5;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:17px;font-weight:700;box-shadow:var(--sh)}
.job{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.job h3{font-size:16px;margin:0;color:var(--tx)}.job p{margin:2px 0;color:var(--mut);font-size:13px}.amt{font-weight:700;margin:6px 0 0}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;color:#fff}
.Menunggu{background:var(--amb)}.Dikerjakan{background:#2f6fe0}.Selesai{background:#0e8a5f}.Diambil{background:#778}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}.acts select{width:auto}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}tr.me td{background:var(--gr)}
.empty{color:var(--mut);text-align:center;padding:22px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.row input,.row select{flex:1;min-width:140px;width:auto}
.hero{border-radius:22px;padding:28px 22px;color:#fff;background:radial-gradient(circle at 85% 10%,rgba(200,162,75,.35),transparent 45%),linear-gradient(135deg,#0a3a2a,#0e6b4e);display:flex;gap:18px;align-items:center;margin-bottom:16px;box-shadow:var(--sh)}
.hero img{width:92px;height:92px;border-radius:22px;background:#fff;padding:5px;flex:none}
.ey{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:700}
.hero h2{margin:4px 0 2px;font-size:26px;line-height:1.15}.hero p{margin:2px 0;opacity:.92}.hero small{display:block;opacity:.72;font-size:12px;margin:6px 0 14px;line-height:1.4}
.hero .btn{background:var(--gold);color:#241b04}
@media(max-width:560px){.hero{flex-direction:column;text-align:center;padding:24px 16px}.hero h2{font-size:22px}}
.unit{display:flex;gap:14px;align-items:center}.unit img{height:44px;background:#fff;border-radius:10px;padding:3px;flex:none}.unit b{display:block}.unit span{color:var(--mut);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chips i{font-style:normal;font-size:11.5px;background:var(--gr);padding:3px 10px;border-radius:999px;color:var(--mut)}
.lg{max-width:400px;margin:16px auto}.lgh{text-align:center;margin-bottom:6px}.lgh img{width:64px;border-radius:16px;background:#fff;padding:4px;border:1px solid var(--bd)}.lgh h2{margin:8px 0 0}.lgh p{margin:0;color:var(--mut);font-size:13px}
.err{color:var(--red);font-size:13px}.mut{color:var(--mut);font-size:12.5px}
.greet{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.greet h2{margin:0}.greet p{margin:2px 0 0;color:var(--mut);font-size:13px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 10px;font-size:14px}.kv span{color:var(--mut)}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--gr);color:var(--pri)}
ol.st{margin:0;padding-left:20px;font-size:14px}ol.st li{margin-bottom:6px}code{background:var(--gr);padding:1px 6px;border-radius:6px;font-size:12.5px}
.unit b.pill{display:inline-block;font-size:13px;font-weight:600;background:var(--gr);color:var(--tx);padding:4px 14px;border-radius:999px;margin-bottom:6px}
.unit b.pill+span{display:block}
.dh{border-radius:24px;padding:20px 18px 18px;color:#fff;background:radial-gradient(circle at 90% 0%,rgba(200,162,75,.42),transparent 48%),radial-gradient(circle at 0% 100%,rgba(52,196,144,.22),transparent 50%),linear-gradient(135deg,#0a3a2a,#0e6b4e);box-shadow:var(--sh);margin-bottom:6px}
.dht{display:flex;align-items:center;gap:14px}.dht img{width:56px;height:56px;border-radius:16px;background:#fff;padding:4px;flex:none}.dht>div{flex:1;min-width:0}
.dht h2{margin:2px 0;font-size:23px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dht p{margin:0;font-size:13px;opacity:.85}
.rf{width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12);color:#fff;font-size:20px;cursor:pointer;flex:none}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.kp>div{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:10px 8px;text-align:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);min-width:0}
.kp b{display:block;font-size:19px;line-height:1.25;overflow-wrap:anywhere}.kp span{display:block;font-size:10.5px;opacity:.8;line-height:1.3;margin-top:2px}
.qa{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:6px}
.qt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;box-shadow:var(--sh);color:var(--tx);font:inherit;cursor:pointer}
.qt b{font-size:14.5px;margin-top:8px}.qt small{font-size:12px;color:var(--mut)}
.qi{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--gr);color:var(--pri)}.qi .ic{width:22px;height:22px}
.qt:nth-child(1) .qi{background:linear-gradient(135deg,#0e6b4e,#34c490);color:#fff}
.two{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}.two .card{margin:0}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:4px}
.bc{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;min-width:0}
.bc i{display:block;width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:color-mix(in srgb,var(--pri) 38%,transparent)}.bc.td i{background:var(--gold)}
.bc em{font-style:normal;font-size:11px;font-weight:600}.bc span{font-size:10.5px;color:var(--mut)}
.dnw{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.dn{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;flex:none}.dn>div{width:76px;height:76px;border-radius:50%;background:var(--card);display:grid;place-content:center;text-align:center}.dn b{font-size:22px;line-height:1}.dn span{font-size:11px;color:var(--mut)}
.lgd{list-style:none;margin:0;padding:0;flex:1;min-width:140px}.lgd li{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0}.lgd li i{width:10px;height:10px;border-radius:50%;flex:none}.lgd li b{margin-left:auto}
.rcl{padding:6px 16px}.ri{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd)}.ri:last-child{border-bottom:0}
.ri b{display:block;font-size:14px}.ri>div:first-child>span{display:block;font-size:12px;color:var(--mut)}.ri .tag{white-space:nowrap}.ri .amt{white-space:nowrap}
@media(min-width:760px){.qa{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.two{grid-template-columns:1.3fr 1fr}.kp b{font-size:22px}}
.dh .big{font-size:32px;margin:2px 0;line-height:1.15;overflow-wrap:anywhere}.dh .rp{margin:0;font-size:13px;opacity:.85}
.pgl{display:flex;justify-content:space-between;font-size:12px;margin-top:14px;opacity:.92}.pgb{height:8px;border-radius:99px;background:rgba(255,255,255,.18);margin-top:6px;overflow:hidden}.pgb i{display:block;height:100%;border-radius:99px;background:var(--gold)}
.st4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
.sx{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:12px;box-shadow:var(--sh);color:var(--tx);font:inherit;cursor:pointer}
.sx.on{border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 32%,transparent)}
.sx i{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);flex:none}
.sx b{display:block;font-size:22px;line-height:1.1}.sx span{font-size:12px;color:var(--mut)}
.cnt{font-size:12px;font-weight:500;color:var(--mut);margin-left:6px}
.mc{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--c);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--sh)}
.mch{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.mch b{display:block;font-size:15.5px}.mch div>span{font-size:12px;color:var(--mut)}
.mcp{margin:8px 0 2px;font-size:13.5px;font-weight:600}.mcw{margin:0;font-size:13px;color:var(--mut)}
.mcf{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--bd)}.mcf .acts{margin:0}
.chip{display:inline-block;background:var(--gr);color:var(--pri);font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;margin-right:8px}
.adv{background:var(--pri);color:var(--pt);border-color:var(--pri);font-weight:600}
.chps{display:flex;gap:8px;overflow-x:auto;margin:14px 0 12px;padding-bottom:4px;scrollbar-width:none}.chps::-webkit-scrollbar{display:none}
.chp{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 15px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}.chp.on{background:var(--pri);color:var(--pt);border-color:var(--pri);font-weight:600}
.btn.xl{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;padding:13px 20px}
.ri .amt{display:block;margin-top:4px}
@media(min-width:760px){.st4{grid-template-columns:repeat(4,1fr)}}
.rw{border-left:5px solid var(--gold)}.rw0{border-left-color:var(--bd)}.rw0 small{color:var(--mut)}
.rwn{margin:0 0 6px;font-size:12.5px;color:var(--pri);font-weight:600}
.rwi{padding:7px 0;border-top:1px dashed var(--bd)}.rwi b{display:block;font-size:13.5px}.rwi span{font-size:12.5px;color:var(--mut)}
</style>

</head>

<script>
function num(v){return parseInt(String(v==null?'':v).replace(/\D/g,''))||0}
function rp(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.')}
function totalOf(s){var t=0,i;for(i=0;i<6;i++)t+=num(s['jb'+i]);for(i=0;i<5;i++)t+=num(s['p'+i+'h']);return t}
var BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function tglID(ts){var t=new Date(ts);return ('0'+t.getDate()).slice(-2)+' '+BLN[t.getMonth()]+' '+t.getFullYear()}

var PAKET=[[8000,'Pembersihan CVT'],[10000,'Kuras Tangki'],[10000,'Kuras Radiator']];
function pdfLayout(d,x,IMG){
 var s=x.d||{},tw=x.tw||{},M=10,R=200,C=105,W=190,y=10,G=238,i;
 var T=function(t,a,b,o,sz,st){d.setFont('helvetica',st||'normal');d.setFontSize(sz||8);d.text(String(t==null?'':t),a,b,o||{})};
 var B=function(a,b,w,h,g){if(g){d.setFillColor(G);d.rect(a,b,w,h,'FD')}else d.rect(a,b,w,h,'S')};

async function xls(){
 var l=repList();if(!l.length){alert('Belum ada data untuk diunduh.');return}

 var tot=l.reduce(function(a,x){return a+totalOf(x.d)},0);A.push(['','','','','','','','','','','TOTAL',tot]);
 var fn='Laporan-Service-Point-'+new Date().toISOString().slice(0,10);
 try{await loadXLSX();var ws=XLSX.utils.aoa_to_sheet(A);ws['!cols']=[{wch:15},{wch:16},{wch:12},{wch:14},{wch:10},{wch:20},{wch:15},{wch:30},{wch:18},{wch:18},{wch:12},{wch:14}];
  for(var r=2;r<=A.length;r++){if(ws['L'+r])ws['L'+r].z='#,##0'}
  var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Laporan Servis');XLSX.writeFile(wb,fn+'.xlsx')
 }catch(e){
  var h='<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"></head><body><table border="1">'+A.map(function(r,i){return '<tr>'+r.map(function(c){return (i==0?'<th>':'<td>')+esc(c)+(i==0?'</th>':'</td>')}).join('')+'</tr>'}).join('')+'</table></body></html>';
  saveBlob(new Blob(['\ufeff'+h],{type:'application/vnd.ms-excel'}),fn+'.xls')}
}

function nextNo(){var m=0;db.jobs.forEach(function(x){var n=parseInt(String(x.no).split('-').pop())||0;if(n>m)m=n});return 'SP-'+new Date().getFullYear()+'-'+String(m+1).padStart(4,'0')}

async function saveJob(x,isNew){
 if(!REMOTE){lsSave();return}
 try{var o=ids();o.data={payload:pl(x)};
  if(isNew){o.rowId=Appwrite.ID.unique();var r=await AW.t.createRow(o);x.id=r.$id}else{o.rowId=x.id;await AW.t.updateRow(o)}
 }catch(e){alert('Gagal menyimpan ke server: '+e.message);throw e}
}
async function removeJob(id){
 if(!REMOTE){db.jobs=db.jobs.filter(function(x){return x.id!=id});lsSave();return}
 try{var o=ids();o.rowId=id;await AW.t.deleteRow(o);db.jobs=db.jobs.filter(function(x){return x.id!=id})}catch(e){alert('Gagal menghapus: '+e.message);throw e}
}

 if(!r)h+=noRole();
 h+='<div class="card sc"><h3>Hak akses per peran</h3><table><tr><th>Peran</th><th>Daftar baru</th><th>Ubah data</th><th>Ubah status</th><th>Hapus</th><th>Laporan & biaya</th><th>Kelola akun</th></tr>'+Object.keys(ROLE_DEF).map(function(k){var d=ROLE_DEF[k];return '<tr'+(k==r?' class="me"':'')+'><td>'+d.n+'</td><td>'+ok(d.create)+'</td><td>'+ok(d.edit)+'</td><td>'+ok(d.status)+'</td><td>'+ok(d.del)+'</td><td>'+ok(d.rep)+'</td><td>'+ok(d.users)+'</td></tr>'}).join('')+'</table></div>';
 if(r=='admin'&&REMOTE)h+='<div class="card"><h3>Cara mengatur peran (admin)</h3><ol class="st"><li>Buat akun dan atur peran lewat menu <b>Kelola Akun</b>.</li><li>Table → <b>Settings → Permissions</b>: ganti role Users dengan role Label. Read: semua label. Create: <code>admin</code>, <code>advisor</code>. Update: semua label. Delete: <code>admin</code>.</li><li>Pengguna keluar lalu masuk lagi agar peran terbaca.</li></ol><p class="mut">Lakukan langkah 2 setelah semua pengguna diberi label.</p></div>';
 return h;
}
function vDash(){
 var r=myRole();if(!r)return noRole();
 var j=db.jobs,m=can('money'),nm=AW.u?(AW.u.name||AW.u.email.split('@')[0]):'Admin';
 var hr=new Date().getHours(),sal=hr<11?'Selamat pagi':hr<15?'Selamat siang':hr<18?'Selamat sore':'Selamat malam';
 var c=function(s){return j.filter(function(x){return x.status==s}).length};
 var today=j.filter(function(x){return sameDay(x.ts)}).length,aktif=c('Menunggu')+c('Dikerjakan');
 var inc=j.filter(function(x){return sameDay(x.ts)&&(x.status=='Selesai'||x.status=='Diambil')}).reduce(function(a,x){return a+totalOf(x.d)},0);
 var hero='<section class="dh"><div class="dht"><img src="'+IMG.df+'" alt=""><div><span class="ey">'+sal+'</span><h2>'+esc(nm)+'</h2><p>'+ROLE_DEF[r].n+' · '+tglID(Date.now())+'</p></div>'+(REMOTE?'<button class="rf" onclick="reload2()" aria-label="Muat ulang" title="Muat ulang">&#8635;</button>':'')+'</div>'+
  '<div class="kp"><div><b>'+today+'</b><span>Unit hari ini</span></div><div><b>'+aktif+'</b><span>Unit aktif</span></div>'+(m?'<div><b>'+R0(inc)+'</b><span>Pendapatan hari ini</span></div>':'<div><b>'+c('Selesai')+'</b><span>Siap diambil</span></div>')+'</div></section>';
 var qa=[];
 if(can('create'))qa.push(['new','Pendaftaran','plus','Daftarkan unit baru']);
 qa.push(['q','Antrian Servis','list',aktif+' unit aktif']);
 qa.push(['mon','Monitor Servis','pulse','Pantau status']);
 if(can('rep'))qa.push(['rep','Laporan','chart','Rekap dan unduh']);
 if(can('users')&&REMOTE)qa.push(['akun','Kelola Akun','users','Atur akun dan peran']);
 var qh='<h2>Menu cepat</h2><div class="qa">'+qa.map(function(i){return '<button class="qt" onclick="go(\''+i[0]+'\')"><span class="qi">'+ic(i[2])+'</span><b>'+i[1]+'</b><small>'+i[3]+'</small></button>'}).join('')+'</div>';
 var HR=['Min','Sen','Sel','Rab','Kam','Jum','Sab'],bars=[],mx=1,i,d,n;
 for(i=6;i>=0;i--){d=new Date(Date.now()-i*864e5);n=j.filter(function(x){return new Date(x.ts).toDateString()==d.toDateString()}).length;bars.push([HR[d.getDay()],n,i==0]);if(n>mx)mx=n}
 var ch='<div class="card"><h3>Unit masuk 7 hari terakhir</h3><div class="bars">'+bars.map(function(b){return '<div class="bc'+(b[2]?' td':'')+'"><em>'+b[1]+'</em><i style="height:'+Math.max(4,Math.round(b[1]/mx*100))+'%"></i><span>'+b[0]+'</span></div>'}).join('')+'</div></div>';
 var CL={Menunggu:'#d98b00',Dikerjakan:'#2f6fe0',Selesai:'#0e8a5f',Diambil:'#778899'},tot=j.length,acc=0,seg=[];
 ST.forEach(function(k){var v=c(k);if(v){seg.push(CL[k]+' '+(acc/tot*100)+'% '+((acc+v)/tot*100)+'%');acc+=v}});
 var dn='<div class="card"><h3>Status unit</h3><div class="dnw"><div class="dn" style="background:'+(tot?'conic-gradient('+seg.join(',')+')':'var(--gr)')+'"><div><b>'+tot+'</b><span>unit</span></div></div><ul class="lgd">'+ST.map(function(k){return '<li><i style="background:'+CL[k]+'"></i>'+(k=='Selesai'?'Siap diambil':k)+'<b>'+c(k)+'</b></li>'}).join('')+'</ul></div></div>';
 var rc=j.slice(0,5),rh='<h2>Aktivitas terbaru</h2>'+(rc.length?'<div class="card rcl">'+rc.map(function(x){return '<div class="ri"><div><b>'+esc(x.d.plat)+' · '+esc(x.d.tipe||'-')+'</b><span>'+esc(x.d.pm_nama||'-')+' · '+tglID(x.ts)+'</span></div><span class="tag '+x.status+'">'+x.status+'</span></div>'}).join('')+'</div>':'<div class="card empty">Belum ada aktivitas.</div>');
 return (loadErr?'<div class="card err">'+esc(loadErr)+'</div>':'')+hero+qh+'<div class="two">'+ch+dn+'</div>'+rh;
}
async function loadAll(){
 loadErr='';
 if(!REMOTE){lsLoad();return}
 var o=ids();o.queries=[Appwrite.Query.orderDesc('$createdAt'),Appwrite.Query.limit(500)];
 var r=await AW.t.listRows(o);
 db.jobs=r.rows.map(function(w){var j=JSON.parse(w.payload);j.id=w.$id;return j});
}
async function reload2(){try{await loadAll()}catch(e){loadErr='Gagal memuat data: '+(e.message||e)}render()}
async function boot0(){
 if(CFG.projectId&&!window.Appwrite){$('app').innerHTML='<div class="card empty">Pustaka Appwrite gagal dimuat. Periksa koneksi internet.</div>';return}
 if(REMOTE){
  var c=new Appwrite.Client().setEndpoint(CFG.endpoint).setProject(CFG.projectId);
  AW.a=new Appwrite.Account(c);AW.t=new Appwrite.TablesDB(c);AW.f=new Appwrite.Functions(c);
  try{AW.u=await AW.a.get()}catch(e){AW.u=null}
 }
 if((!REMOTE||AW.u)&&myRole()){try{await loadAll()}catch(e){loadErr='Gagal memuat data: '+(e.message||e)}}
 tab=(REMOTE&&!AW.u)?'home':'dash';render();
}
async function boot(){try{await boot0()}catch(e){$('app').innerHTML='<div class="card empty">Terjadi kesalahan: '+esc(e.message||e)+'</div>'}}
function setFt(){var f=$('ft');if(f)document.documentElement.style.setProperty('--ftH',f.offsetHeight+'px')}
setFt();addEventListener('resize',setFt);addEventListener('load',setFt);
if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
$('lgdf').src=IMG.df;$('burger').innerHTML=ic('menu');$('th').innerHTML=ic('sun');
ROLE_DEF.admin.users=1;
ICO.users='<circle cx="9" cy="8" r="3.5"/><path d="M2 21c0-3.5 3-5.5 7-5.5s7 2 7 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 15.8c2.4.6 4 2.2 4 5.2"/>';
TITLES.akun='Kelola Akun';
var AK={list:null,err:'',form:null,busy:false};
async function api(action,data){
 var ex=await AW.f.createExecution({functionId:CFG.functionId,body:JSON.stringify(Object.assign({action:action},data||{})),async:false,path:'/',method:(Appwrite.ExecutionMethod?Appwrite.ExecutionMethod.POST:'POST')});
 var r={};try{r=JSON.parse(ex.responseBody||'{}')}catch(e){}
 if(ex.responseStatusCode>=400||r.ok===false)throw new Error(r.error||('Kesalahan '+ex.responseStatusCode));
 return r;
}
async function akunLoad(){AK.err='';try{var r=await api('list');AK.list=r.users}catch(e){AK.err=e.message||String(e)}AK.busy=false;render()}
function roleOf(l){for(var k in ROLE_DEF)if((l||[]).indexOf(k)>-1)return k;return ''}
function vAkun(){
 if(!CFG.functionId)return '<div class="card"><h3>Kelola Akun</h3><p>functionId belum diisi di config.js.</p></div>';
 if(AK.list===null&&!AK.err&&!AK.busy){AK.busy=true;akunLoad()}
 var h='<div class="greet"><div><h2>Kelola Akun</h2><p>Tambah, ubah, nonaktifkan, dan hapus akun pengguna.</p></div><button class="btn" onclick="akunBaru()">Tambah akun</button></div>'+akunForm();
 if(AK.err)h+='<div class="card"><p class="err">'+esc(AK.err)+'</p><p class="mut">Pastikan Function kelola-akun sudah di-deploy dan akses eksekusinya mencakup admin.</p><button class="btn s" onclick="AK.err=\'\';AK.list=null;render()">Coba lagi</button></div>';
 else if(AK.list===null)h+='<div class="card empty">Memuat akun…</div>';
 else h+=AK.list.length?AK.list.map(akunCard).join(''):'<div class="card empty">Belum ada akun.</div>';
 return h;
}
function akunForm(){
 var f=AK.form;if(!f)return '';var e=!!f.id,me=e&&AW.u&&f.id==AW.u.$id;
 var ro=['admin','pembimbing','advisor','mekanik',''].map(function(k){return '<option value="'+k+'"'+(f.role==k?' selected':'')+'>'+(k?ROLE_DEF[k].n:'Tanpa peran')+'</option>'}).join('');
 return '<div class="card"><h3>'+(e?'Ubah akun':'Tambah akun')+'</h3><div class="f"><div><label>Nama</label><input id="ak_n" value="'+esc(f.name)+'"></div><div><label>Email</label><input id="ak_e" type="email" value="'+esc(f.email)+'"></div><div><label>Kata sandi'+(e?' (kosongkan jika tidak diganti)':' (min. 8 karakter)')+'</label><input id="ak_p" type="password" autocomplete="new-password"></div><div><label>Peran</label><select id="ak_r"'+(me?' disabled':'')+'>'+ro+'</select></div></div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn" onclick="akunSave()">Simpan</button><button class="btn s" onclick="AK.form=null;render()">Batal</button></div><p id="ak_m" class="err"></p></div>';
}
function akunCard(u){
 var r=roleOf(u.labels),me=AW.u&&u.id==AW.u.$id;
 return '<div class="card"><div class="job"><div><h3>'+esc(u.name||'(tanpa nama)')+(me?' <span class="badge">Anda</span>':'')+'</h3><p>'+esc(u.email)+'</p><p>Bergabung: '+tglID(u.joined)+'</p></div><div style="text-align:right"><span class="badge">'+(r?ROLE_DEF[r].n:'Tanpa peran')+'</span><p class="mut" style="margin:6px 0 0">'+(u.status?'Aktif':'Nonaktif')+'</p></div></div><div class="acts"><button class="btn s" onclick="akunEdit(\''+u.id+'\')">Ubah</button>'+(me?'':'<button class="btn s" onclick="akunStatus(\''+u.id+'\','+(!u.status)+')">'+(u.status?'Nonaktifkan':'Aktifkan')+'</button><button class="btn s dg" onclick="akunDel(\''+u.id+'\')">Hapus</button>')+'</div></div>';
}
function akunBaru(){AK.form={id:'',name:'',email:'',role:'advisor'};render()}
function akunEdit(id){var u=AK.list.filter(function(x){return x.id==id})[0];AK.form={id:id,name:u.name,email:u.email,role:roleOf(u.labels)};render()}
function akunRefresh(){AK.form=null;AK.list=null;AK.err='';AK.busy=false;render()}
async function akunSave(){
 var f=AK.form,m=$('ak_m'),d={name:$('ak_n').value.trim(),email:$('ak_e').value.trim(),password:$('ak_p').value,role:$('ak_r').value};m.textContent='';
 if(!d.name||!d.email){m.textContent='Nama dan email wajib diisi.';return}
 if((!f.id||d.password)&&d.password.length<8){m.textContent='Kata sandi minimal 8 karakter.';return}
 try{if(f.id){d.id=f.id;if(!d.password)delete d.password;await api('update',d)}else await api('create',d);akunRefresh()}
 catch(e){m.textContent=e.message||String(e)}
}
async function akunStatus(id,s){try{await api('update',{id:id,status:s});akunRefresh()}catch(e){alert(e.message||e)}}
async function akunDel(id){if(!confirm('Hapus akun ini secara permanen?'))return;try{await api('delete',{id:id});akunRefresh()}catch(e){alert(e.message||e)}}
boot();
</script>
